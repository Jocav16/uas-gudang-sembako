# =====================================================================
# nginx.conf — Konfigurasi Nginx untuk Gudang Sembako App
# =====================================================================
# Cara pakai di VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/gudang-sembako
#   sudo ln -s /etc/nginx/sites-available/gudang-sembako /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain/IP VPS Anda
    server_name yourdomain.com www.yourdomain.com;

    # -------------------------------------------------------
    # FRONTEND — Sajikan hasil build React (npm run build)
    # -------------------------------------------------------
    root /var/www/gudang-sembako-app/frontend/dist;
    index index.html;

    # React SPA: semua route dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # BACKEND API — Reverse Proxy ke Laravel
    # -------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sanctum CSRF cookie juga perlu diproxy ke Laravel
    location /sanctum/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Optimasi: Cache static assets
    # -------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sembunyikan file sensitif
    location ~ /\. {
        deny all;
    }
}

# =====================================================================
# (NILAI PLUS) Redirect HTTP ke HTTPS setelah SSL aktif:
# Jalankan: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot akan otomatis menambahkan blok HTTPS di bawah ini.
# =====================================================================
